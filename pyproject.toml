[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workbuddy-sync"
version = "0.1.0"
description = "Download WorkBuddy expert and expert-team bundles from the public expert marketplace manifest."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "openpyxl>=3.1",
  "typer>=0.12",
  "rich>=13.7",
]

[project.scripts]
workbuddy-sync = "workbuddy_sync.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
